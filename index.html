<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Time Pokemon (Vanilla)</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>

    <div class="main">
    <h1>Time Pokémon (Vanilla)</h1>
    </div>

    <div class="form">
    <form>
        <input type="text" id="input-Num" class="input" placeholder="Número do Pokemon (ex: 1000)">
        <button type="submit" class="btn-buscar" id="buscar" >Buscar</button>
        <div class="sprite"></div>
        <h2>Time: <span>0</span>/6</h2>
    </form>
    </div>
    

    <script src="script.js"></script>
  </body>
</html>
